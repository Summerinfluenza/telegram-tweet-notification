name: Tweet notifier

on:
  schedule:
    # Every 5 minutes (GitHub's minimum; runs can be a few minutes late).
    # Private repo? Use "*/30 * * * *" to stay inside the free minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: tweet-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json (last seen post per account) is kept in the Actions
      # cache, not committed, so the repo history stays clean and private.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tweet-state-${{ github.run_id }}
          restore-keys: tweet-state-

      - name: Check for new posts
        run: python -m notifier.main
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_ACCOUNTS: ${{ secrets.X_ACCOUNTS }}
          INCLUDE_REPLIES: ${{ vars.INCLUDE_REPLIES }}
          INCLUDE_REPOSTS: ${{ vars.INCLUDE_REPOSTS }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tweet-state-${{ github.run_id }}-${{ github.run_attempt }}
